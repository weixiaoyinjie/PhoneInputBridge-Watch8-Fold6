name: Build Phone and Watch APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore shared debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-input-bridge-debug-signing-v1

      - name: Build both APKs
        run: gradle :phone:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p output
          cp phone/build/outputs/apk/debug/phone-debug.apk output/PhoneInputBridge_PHONE.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk output/PhoneInputBridge_WEAR.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs output/PhoneInputBridge_PHONE.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs output/PhoneInputBridge_WEAR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneInputBridge-APK
          path: output/*.apk
          if-no-files-found: error
