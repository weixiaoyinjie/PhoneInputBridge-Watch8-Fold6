name: Build Phone and Watch APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk/platforms
          ls /usr/local/lib/android/sdk/build-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore shared debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-input-bridge-debug-signing-v1

      - name: Build both APKs
        run: |
          gradle :phone:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p output
          cp phone/build/outputs/apk/debug/phone-debug.apk output/PhoneInputBridge_PHONE.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk output/PhoneInputBridge_WEAR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneInputBridge-APK
          path: output/*.apk
          if-no-files-found: error
